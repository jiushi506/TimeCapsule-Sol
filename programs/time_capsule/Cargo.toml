[package]
name = "time_capsule"
version = "0.1.0"
description = "TimeCapsule Solana registry program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "time_capsule"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.1"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
